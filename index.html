<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>alphaTab test</title>
  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.js"></script>
  <style>
    .at-cursor-bar { background: rgba(96, 125, 139, 0.28); }
    .at-cursor-beat { background: rgba(64, 64, 255, 0.75); width: 3px; }
    .at-highlight * { fill: #1971c2; stroke: #1971c2; }
    .at-highlight text { font-weight: bold !important; }
  </style>
</head>
<body>
  <button id="play" disabled>再生 / 一時停止</button>
  <div id="alphaTab"></div>
  <script>
    const api = new alphaTab.AlphaTabApi(document.getElementById('alphaTab'), {
      core: { includeNoteBounds: true },
      display: { staveProfile: 'Tab' },
      player: {
        playerMode: alphaTab.PlayerMode.EnabledAutomatic,
        soundFont: 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/soundfont/sonivox.sf2',
      },
    });
    const playButton = document.getElementById('play');
    api.playerReady.on(() => { playButton.disabled = false; });
    playButton.addEventListener('click', () => api.playPause());
    api.noteMouseDown.on((note) => { if (api.isReadyForPlayback) api.playNote(note); });
    api.tex(`
      \\title "Same Old Blues - Aaug"
      \\tempo 77
      .
      \\ts 3 4
      :8 5.1{st} 6.2{st} 6.3{st} 7.4{sib st} 8.5{st} 9.6{st} |
      5.6{st} 9.6{st} 8.5{st} 7.4{st} 6.4{st} 5.4{st} |
      (5.5{sib st} 7.4{sib st} 7.3{sib st} 7.2{sib st} 5.1{sib st}).2 r.4 |
    `);
  </script>
</body>
</html>
